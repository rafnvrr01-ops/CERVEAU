<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Survival Colony</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game-root">
  <div style="display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:6px;align-items:start;">
    <div>
      <div style="display:flex;gap:4px;margin-bottom:4px;flex-wrap:wrap;font-size:10px;">
        <div style="background:var(--color-background-secondary);padding:3px 7px;border-radius:5px;">J<span id="day-count">1</span></div>
        <div style="background:var(--color-background-secondary);padding:3px 7px;border-radius:5px;"><span id="time-count">06:00</span></div>
        <div style="background:var(--color-background-secondary);padding:3px 7px;border-radius:5px;"><span id="season-label">Printemps</span></div>
        <div style="background:var(--color-background-secondary);padding:3px 7px;border-radius:5px;"><span id="weather-label">Clair</span></div>
        <div style="background:var(--color-background-secondary);padding:3px 7px;border-radius:5px;">Pop:<span id="pop-count">1</span></div>
        <div style="background:var(--color-background-secondary);padding:3px 7px;border-radius:5px;">Score:<span id="score-count">0</span>/100</div>
      </div>
      <div style="display:flex;gap:4px;flex-wrap:wrap;">
        <button class="menu-btn active" data-menu="actions" style="padding:4px 10px;border-radius:5px;font-size:11px;cursor:pointer;border:0.5px solid var(--color-border-secondary);background:var(--color-background-info);">Actions</button>
        <button class="menu-btn" data-menu="resources" style="padding:4px 10px;border-radius:5px;font-size:11px;cursor:pointer;border:0.5px solid var(--color-border-secondary);background:transparent;">Ressources</button>
        <button class="menu-btn" data-menu="buildings" style="padding:4px 10px;border-radius:5px;font-size:11px;cursor:pointer;border:0.5px solid var(--color-border-secondary);background:transparent;">Bâtiments</button>
        <button class="menu-btn" data-menu="tech" style="padding:4px 10px;border-radius:5px;font-size:11px;cursor:pointer;border:0.5px solid var(--color-border-secondary);background:transparent;">Tech</button>
        <button class="menu-btn" data-menu="colony" style="padding:4px 10px;border-radius:5px;font-size:11px;cursor:pointer;border:0.5px solid var(--color-border-secondary);background:transparent;">Colonie</button>
        <button id="btn-pause" style="padding:4px 10px;border-radius:5px;font-size:11px;cursor:pointer;border:0.5px solid var(--color-border-secondary);background:transparent;">Pause</button>
        <button id="btn-speed" style="padding:4px 10px;border-radius:5px;font-size:11px;cursor:pointer;border:0.5px solid var(--color-border-secondary);background:transparent;">x1</button>
      </div>
    </div>
    <canvas id="minimap" width="130" height="130" style="background:#1a1a2a;border:0.5px solid var(--color-border-secondary);border-radius:5px;cursor:pointer;"></canvas>
  </div>
  <div id="status-line" style="font-size:11px;padding:3px 6px;background:var(--color-background-secondary);border-radius:4px;margin-bottom:4px;">Mode: move</div>
  <div id="panel-actions" class="panel" style="background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:5px;padding:6px;margin-bottom:6px;display:flex;gap:4px;flex-wrap:wrap;"></div>
  <div id="panel-resources" class="panel" style="background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:5px;padding:6px;margin-bottom:6px;display:none;flex-wrap:wrap;"></div>
  <div id="panel-buildings" class="panel" style="background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:5px;padding:6px;margin-bottom:6px;display:none;flex-wrap:wrap;"></div>
  <div id="panel-tech" class="panel" style="background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:5px;padding:6px;margin-bottom:6px;display:none;flex-wrap:wrap;"></div>
  <div id="panel-colony" class="panel" style="background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:5px;padding:6px;margin-bottom:6px;display:none;flex-wrap:wrap;"></div>
  <canvas id="canvas" style="border:none;cursor:crosshair;display:block;width:100vw;"></canvas>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
