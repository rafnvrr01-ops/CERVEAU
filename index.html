<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Survival Colony</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="canvas"></canvas>
  <aside id="sidebar">
    <div class="top-stats">
      <div class="stat"><span class="icon">📅</span><span id="day-count">1</span></div>
      <div class="stat"><span class="icon">🕐</span><span id="time-count">06:00</span></div>
      <div class="stat"><span class="icon">🌱</span><span id="season-label">Printemps</span></div>
      <div class="stat"><span class="icon">☁️</span><span id="weather-label">Clair</span></div>
      <div class="stat"><span class="icon">👥</span><span id="pop-count">1</span></div>
      <div class="stat stat-score"><span class="icon">🏆</span><span id="score-count">0</span>/100</div>
    </div>
    <div class="controls">
      <button id="btn-pause" class="ctrl-btn">⏸ Pause</button>
      <button id="btn-speed" class="ctrl-btn">⏩ x1</button>
    </div>
    <canvas id="minimap" width="240" height="160"></canvas>
    <div id="status-line">Mode: move</div>
    <nav class="tabs">
      <button class="menu-btn active" data-menu="actions">Actions</button>
      <button class="menu-btn" data-menu="resources">Ressources</button>
      <button class="menu-btn" data-menu="buildings">Bâtiments</button>
      <button class="menu-btn" data-menu="tech">Tech</button>
      <button class="menu-btn" data-menu="colony">Colonie</button>
    </nav>
    <div class="panels">
      <div id="panel-actions" class="panel active"></div>
      <div id="panel-resources" class="panel"></div>
      <div id="panel-buildings" class="panel"></div>
      <div id="panel-tech" class="panel"></div>
      <div id="panel-colony" class="panel"></div>
    </div>
  </aside>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
